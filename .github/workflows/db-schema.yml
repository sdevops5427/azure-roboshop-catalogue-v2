name: Catalogue DB Image

on:
  push:
    branches:
      - db
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
#      - run: cd db
      - name: Docker Build
        run: docker build --load -t catalogue-db-image ./db
      - name: Tag Image
        run: docker tag catalogue-db-image:latest roboshop5427.azurecr.io/catalogue-db-image:latest
      - name: Push Image
        run: docker push roboshop5427.azurecr.io/catalogue-db-image:latest
